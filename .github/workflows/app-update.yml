name: Actualizar app (resultados y cierre)

# Corre en los servidores de GitHub, gratis y sin depender de Claude.
# Horas en UTC (Lisboa = UTC en invierno, UTC+1 en verano). GitHub puede retrasar los cron unos minutos.
on:
  schedule:
    - cron: '50 12-23 * * *'   # resultados cada hora por la tarde/noche
    - cron: '20 1 * * *'       # cierre diario de madrugada
  workflow_dispatch:
    inputs:
      modo:
        description: 'results o close'
        default: 'results'

permissions:
  contents: write

concurrency:
  group: app-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet beautifulsoup4
      - name: Elegir modo
        id: modo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ github.event.inputs.modo }}";
          elif [ "${{ github.event.schedule }}" = "20 1 * * *" ]; then m=close; else m=results; fi
          echo "m=$m" >> "$GITHUB_OUTPUT"
      - name: Picks (marcadores ESPN)
        run: python3 tools/picks.py || true
      - name: Pronósticos OddSlot (${{ steps.modo.outputs.m }})
        run: python3 tools/update.py ${{ steps.modo.outputs.m }}
      - name: Guardar cambios
        run: |
          python3 -c "import json;json.load(open('data.json'))"
          if git diff --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "A. Analytics bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.modo.outputs.m }}" = "close" ]; then msg="Cierre diario $(TZ=Europe/Lisbon date -d yesterday +%F)";
          else msg="Resultados $(TZ=Europe/Lisbon date +%H:%M)"; fi
          git commit -am "$msg"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
