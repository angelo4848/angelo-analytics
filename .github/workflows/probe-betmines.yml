name: Probe BetMines (temporal)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sSL -A "$UA" -o home.html -w "home %{http_code}\n" https://www.betmines.com/ || true
          head -c 1500 home.html; echo
          grep -oE 'https?://[a-zA-Z0-9./_-]*betmines[a-zA-Z0-9./_?=&-]*' home.html | sort -u | head -40
          for js in $(grep -oE '(src|href)="[^"]+\.js"' home.html | cut -d'"' -f2 | head -15); do
            case "$js" in http*) u="$js";; *) u="https://www.betmines.com/${js#/}";; esac
            curl -sSL -A "$UA" "$u" | grep -oE 'https?://[a-zA-Z0-9.-]*betmines[a-zA-Z0-9./_-]*' | sort -u | head -20
          done
          for u in "https://api.betmines.com/betmines/v1/fixtures/web?dateFormat=extended&platform=website" \
                   "https://api.betmines.com/betmines/v1/fixtures/today" ; do
            echo "== $u"; curl -sS -A "$UA" -w "\nHTTP %{http_code}\n" "$u" | head -c 800; echo
          done
